<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1d24"/>
      <stop offset="100%" style="stop-color:#2a2d34"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ba9eff"/>
      <stop offset="100%" style="stop-color:#6b8cff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 抽象 Q / 柒 变形：圆环 + 斜杠 + 光芒点 -->
  <circle cx="32" cy="30" r="18" fill="none" stroke="url(#glow)" stroke-width="5" stroke-linecap="round"/>
  <line x1="44" y1="42" x2="56" y2="54" stroke="url(#glow)" stroke-width="5" stroke-linecap="round"/>
  <!-- 右上角光点 -->
  <circle cx="46" cy="16" r="3" fill="url(#glow)"/>
  <circle cx="18" cy="48" r="2" fill="#ba9eff" opacity="0.6"/>
  <circle cx="52" cy="34" r="1.5" fill="#6b8cff" opacity="0.8"/>
</svg>
