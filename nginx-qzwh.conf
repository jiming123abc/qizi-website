# =====================================================
# 兼容 Cloudflare 的 HTTP(80) 与 HTTPS(443) 联合配置
# 方案2：针对视频上传优化的完整配置
# =====================================================
server {
    listen 80;
    listen 443 ssl;
    server_name qzwh.me www.qzwh.me;

    # 🔒 允许最大 2G 的大视频/大文件上传（防止 413 报错）
    client_max_body_size 2048M;
    client_body_buffer_size 128k;

    # -----------------------------------------------------
    # SSL 证书路径（沿用你服务器上 Let's Encrypt 的证书位置）
    # -----------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/qiziwenhua.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qiziwenhua.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # -----------------------------------------------------
    # HTTP/2 和 Keepalive 优化（关键！解决连接超时问题）
    # -----------------------------------------------------
    client_body_timeout 1800s;      # 客户端发送超时 30分钟
    client_header_timeout 300s;     # 客户端 header 超时
    send_timeout 1800s;             # 服务端发送超时
    keepalive_timeout 1800s;        # 保持连接 30分钟
    keepalive_requests 1000;        # 单连接最大请求数

    # -----------------------------------------------------
    # 1. 网页前端静态文件代理（🎯 已精准修正为你的真实路径：/root/website/dist）
    # -----------------------------------------------------
    location / {
        root /root/website/dist;
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------------
    # 2. 通用 API 代理
    # -----------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API 超时设置
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # -----------------------------------------------------
    # 3. 大文件视频/图片上传专用通道（彻底攻克 504 超时与连接断开）
    # -----------------------------------------------------
    location /api/upload/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⏱️ 核心长超时锁定（设置为 30 分钟，确保压缩+上传足够时间）
        proxy_connect_timeout 300s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;

        # ❌ 关闭 Nginx 的临时中转缓冲区，让长连接数据直接传给后端服务
        proxy_buffering off;
        proxy_request_buffering off;
        
        # 保持连接活跃
        proxy_set_header Connection "";
        tcp_nodelay on;
        tcp_nopush on;
    }

    # -----------------------------------------------------
    # 4. 静态资源路径（/uploads 和 /images）
    # -----------------------------------------------------
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /images/ {
        proxy_pass http://127.0.0.1:5000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
