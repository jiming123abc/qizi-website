# =====================================================
# 修复版：正确的 Nginx 配置
# =====================================================
server {
    listen 80;
    listen 443 ssl;
    server_name qzwh.me www.qzwh.me;

    # 🔒 允许最大 2G 的大视频/大文件上传（防止 413 报错）
    client_max_body_size 2048M;
    client_body_buffer_size 128k;

    # -----------------------------------------------------
    # SSL 证书路径
    # -----------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/qiziwenhua.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qiziwenhua.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # -----------------------------------------------------
    # HTTP/2 和 Keepalive 优化
    # -----------------------------------------------------
    client_body_timeout 1800s;
    client_header_timeout 300s;
    send_timeout 1800s;
    keepalive_timeout 1800s;
    keepalive_requests 1000;

    # -----------------------------------------------------
    # 🎯 启用 SharedArrayBuffer（FFmpeg WebAssembly 必需）
    # credentialless 模式：允许加载跨域资源，兼容阿里云 OSS
    # -----------------------------------------------------
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    # -----------------------------------------------------
    # FFmpeg 静态文件服务
    # -----------------------------------------------------
    location /ffmpeg/ {
        root /root/website/dist;
        expires 30d;
    }

    # -----------------------------------------------------
    # 1. 网页前端静态文件
    # -----------------------------------------------------
    location / {
        root /root/website/dist;
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------------
    # 2. 通用 API 代理
    # -----------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 300s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # -----------------------------------------------------
    # 3. 大文件上传专用通道
    # -----------------------------------------------------
    location /api/upload/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # -----------------------------------------------------
    # 4. 静态资源路径
    # -----------------------------------------------------
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /images/ {
        proxy_pass http://127.0.0.1:5000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
