<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大连柒子文化发展有限公司</title>
  
  <!-- Open Graph Meta Tags for Social Sharing -->
  <meta property="og:title" content="大连柒子文化发展有限公司" />
  <meta property="og:description" content="诚信立足 创新致远" />
  <meta property="og:image" content="/images/hero-home.png" />
  <meta property="og:url" content="" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="大连柒子文化发展有限公司" />
  
  <!-- WeChat Specific Meta Tags -->
  <meta name="description" content="诚信立足 创新致远" />
  <meta name="wechat:title" content="大连柒子文化发展有限公司" />
  <meta name="wechat:description" content="诚信立足 创新致远" />
  <meta name="wechat:image" content="/images/hero-home.png" />
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="大连柒子文化发展有限公司" />
  <meta name="twitter:description" content="诚信立足 创新致远" />
  <meta name="twitter:image" content="/images/hero-home.png" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #0c0e14 0%, #1a1f2e 50%, #161827 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }
    
    /* 装饰性背景元素 */
    .bg-decoration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    
    .bg-decoration::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                  radial-gradient(circle at 70% 70%, rgba(168, 85, 247, 0.1) 0%, transparent 50%);
      animation: floatBg 20s ease-in-out infinite;
    }
    
    @keyframes floatBg {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, -20px); }
    }
    
    .container {
      text-align: center;
      color: white;
      position: relative;
      z-index: 1;
      width: 100%;
    }
    
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      padding: 0;
      max-width: 420px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: cardIn 0.6s ease-out;
    }
    
    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    /* 作品图片区域 */
    .work-preview {
      position: relative;
      width: 100%;
      aspect-ratio: 16/10;
      overflow: hidden;
      background: linear-gradient(135deg, #1e2030 0%, #2d3048 100%);
    }
    
    .work-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: imgIn 0.8s ease-out 0.2s both;
    }
    
    @keyframes imgIn {
      from { opacity: 0; transform: scale(1.1); }
      to { opacity: 1; transform: scale(1); }
    }
    
    .work-preview::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100px;
      background: linear-gradient(to top, rgba(12, 14, 20, 0.9), transparent);
    }
    
    /* 内容区域 */
    .content {
      padding: 32px 28px 28px;
    }
    
    /* Logo */
    .logo-wrapper {
      margin-bottom: 20px;
    }
    
    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      font-size: 28px;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
      animation: logoPulse 2s ease-in-out infinite;
    }
    
    @keyframes logoPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    /* 作品信息 */
    .work-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 0%, #e0e7ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.3;
    }
    
    .work-desc {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 24px;
      line-height: 1.6;
    }
    
    /* 加载状态 */
    .loading-wrapper {
      margin-bottom: 24px;
    }
    
    .loading-text {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .dots {
      display: flex;
      gap: 4px;
    }
    
    .dot {
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      animation: dotPulse 1.4s ease-in-out infinite;
    }
    
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    
    @keyframes dotPulse {
      0%, 60%, 100% {
        transform: scale(1);
        opacity: 0.4;
      }
      30% {
        transform: scale(1.4);
        opacity: 1;
      }
    }
    
    /* 按钮 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 40px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: white;
      font-weight: 600;
      font-size: 16px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      border: none;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
      position: relative;
      overflow: hidden;
    }
    
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }
    
    .btn:hover::before {
      left: 100%;
    }
    
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4);
    }
    
    .btn:active {
      transform: translateY(-1px);
    }
    
    /* 进度条 */
    .progress-wrapper {
      margin-top: 20px;
      width: 100%;
    }
    
    .progress-bar {
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      border-radius: 3px;
      animation: progress 1.5s ease-out forwards;
      width: 0%;
    }
    
    @keyframes progress {
      from { width: 0%; }
      to { width: 100%; }
    }
    
    .progress-text {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 8px;
    }
    
    /* 品牌信息 */
    .brand-footer {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .brand-name {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="bg-decoration"></div>
  
  <div class="container">
    <div class="card">
      <!-- 作品预览图 -->
      <div class="work-preview">
        <img src="/images/hero-home.png" alt="作品预览" id="workImage" />
      </div>
      
      <div class="content">
        <!-- Logo -->
        <div class="logo-wrapper">
          <div class="logo">🎨</div>
        </div>
        
        <!-- 作品标题 -->
        <h1 class="work-title" id="workTitle">大连柒子文化发展有限公司</h1>
        
        <!-- 作品描述 -->
        <p class="work-desc" id="workDesc">诚信立足 创新致远</p>
        
        <!-- 加载状态 -->
        <div class="loading-wrapper">
          <div class="loading-text">
            <span>正在准备</span>
            <div class="dots">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
        </div>
        
        <!-- 跳转按钮 -->
        <button class="btn" id="goBtn" onclick="goToApp()">
          立即查看作品
        </button>
        
        <!-- 进度条 -->
        <div class="progress-wrapper">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <p class="progress-text">即将自动跳转...</p>
        </div>
        
        <!-- 品牌信息 -->
        <div class="brand-footer">
          <div class="brand-name">QIZI CULTURE</div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    var autoRedirectTimer = null;
    
    // 提取作品 ID
    function getWorkId() {
      var pathParts = window.location.pathname.split('/');
      return pathParts[pathParts.length - 1];
    }
    
    // 跳转到主应用
    function goToApp() {
      if (autoRedirectTimer) {
        clearTimeout(autoRedirectTimer);
      }
      
      var workId = getWorkId();
      if (workId) {
        window.location.href = '/?id=' + workId;
      } else {
        window.location.href = '/';
      }
    }
    
    // 页面加载完成后开始倒计时
    window.addEventListener('load', function() {
      // 1.8秒后自动跳转，给用户足够时间看到页面内容
      autoRedirectTimer = setTimeout(goToApp, 1800);
    });
  </script>
</body>
</html>
